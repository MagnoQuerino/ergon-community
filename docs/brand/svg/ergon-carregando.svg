<svg class="eg-mark eg-anim" xmlns="http://www.w3.org/2000/svg" viewBox="-307.4 -338.2 614.9 614.9" width="160" height="160" role="img" aria-label="Ergon"><style> .eg-mark, .eg-word { display: block; overflow: visible; } .eg-mark { --amp: 26; } .eg-anim .eg-fig { animation: eg-gather .95s cubic-bezier(.2, .75, .25, 1) calc(var(--i) * 70ms - var(--t0, 0ms)) both; } .eg-anim .eg-core { transform-box: fill-box; transform-origin: center; animation: eg-pop .7s cubic-bezier(.3, 1.5, .5, 1) calc(.4s - var(--t0, 0ms)) both, eg-breathe 2.4s ease-in-out calc(1.1s - var(--t0, 0ms)) infinite; } .eg-anim .eg-letter { animation: eg-rise .6s cubic-bezier(.2, .7, .3, 1) calc(.55s + var(--i) * 70ms - var(--t0, 0ms)) both; } .eg-anim .eg-fig__move { animation: eg-wave 2.4s ease-in-out calc(1.1s + var(--i) * 480ms - var(--t0, 0ms)) infinite; } .eg-anim .eg-fig__head { animation: eg-nod 2.4s ease-in-out calc(1.18s + var(--i) * 480ms - var(--t0, 0ms)) infinite; } .eg-anim.eg-anim--loop .eg-fig, .eg-anim.eg-anim--loop .eg-letter { animation: none; } .eg-anim.eg-anim--loop .eg-core { animation: eg-breathe 2.4s ease-in-out infinite; } .eg-anim.eg-anim--loop .eg-fig__move { animation-delay: calc(var(--i) * 480ms); } .eg-anim.eg-anim--loop .eg-fig__head { animation-delay: calc(80ms + var(--i) * 480ms); } @keyframes eg-gather { from { transform: rotate(-40deg) translate(calc(var(--ux) * 170px), calc(var(--uy) * 170px)); opacity: 0; } 55% { opacity: 1; } to { transform: none; opacity: 1; } } @keyframes eg-pop { from { transform: scale(0); } to { transform: scale(1); } } @keyframes eg-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(.92); } } @keyframes eg-rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } } @keyframes eg-wave { 0%, 36%, 100% { transform: translate(0, 0); } 16% { transform: translate(calc(var(--ux) * var(--amp, 26) * 1px), calc(var(--uy) * var(--amp, 26) * 1px)); } } @keyframes eg-nod { 0%, 36%, 100% { transform: translate(0, 0); } 16% { transform: translate(calc(var(--ux) * var(--amp, 26) * .55px), calc(var(--uy) * var(--amp, 26) * .55px)); } } @media (prefers-reduced-motion: reduce) { .eg-anim .eg-fig, .eg-anim .eg-fig__move, .eg-anim .eg-fig__head, .eg-anim .eg-letter { animation: none !important; } .eg-anim .eg-core { animation: eg-fade 1.4s ease-in-out infinite alternate !important; } } @keyframes eg-fade { from { opacity: 1; } to { opacity: .45; } } .eg-splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; background: #f4efe6; color: #1D184B; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; } .eg-splash .eg-mark { width: 116px; height: 116px; } .eg-splash .eg-word { width: 132px; margin-top: 2px; } .eg-splash__label { margin: 0; min-height: 20px; color: #6b6a62; font-size: 13px; letter-spacing: .02em; text-align: center; max-width: min(420px, 90vw); } .eg-loader { display: grid; justify-items: center; gap: 12px; } .eg-loader__label { font-size: 13px; letter-spacing: .02em; opacity: .85; } .eg-inline { display: flex; align-items: center; gap: 8px; } .eg-inline .eg-mark { width: 18px; height: 18px; flex: none; } .brand-logo { display: inline-flex; align-items: center; flex: none; } .brand-logo > svg { display: block; height: 100%; width: auto; overflow: visible; } .brand-logo > svg.eg-anim { --amp: 60; } .eg-phrases { min-height: 150px; align-content: center; } .eg-phrases__txt { font-size: 14px; color: var(--muted, #6b6a62); text-align: center; max-width: 360px; animation: eg-phrase .5s ease; } @keyframes eg-phrase { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } @media (prefers-reduced-motion: reduce) { .eg-phrases__txt { animation: none; } } </style><g class="eg-fig eg-fig--navy" style="--ux:0;--uy:-1;--i:0" fill="#1D184B"><g class="eg-fig__move"><path class="eg-fig__arms" d="M125.9 -210.7A146.6 129 90 0 1 -125.9 -210.7L-77.5 -234.6A85.8 77.9 90 0 0 77.5 -234.6Z"/><circle class="eg-fig__head" cx="0" cy="-242.8" r="47.7"/></g></g><g class="eg-fig eg-fig--navy" style="--ux:0.943;--uy:-0.332;--i:1" fill="#1D184B"><g class="eg-fig__move"><path class="eg-fig__arms" d="M240.9 40.4A137 120.6 155.4 0 1 166.4 -183.4L203.7 -146.5A76.5 70.7 155.4 0 0 254.4 -14.6Z"/><circle class="eg-fig__head" cx="231.2" cy="-81.4" r="43.3"/></g></g><g class="eg-fig eg-fig--teal" style="--ux:0.652;--uy:0.758;--i:2" fill="#1F5B6B"><g class="eg-fig__move"><path class="eg-fig__arms" d="M38 229A133.5 121.5 214.6 0 1 227.7 80.3L196.5 129A68.7 64.6 214.6 0 0 96 211Z"/><circle class="eg-fig__head" cx="148.2" cy="172.3" r="43.3"/></g></g><g class="eg-fig eg-fig--teal" style="--ux:-0.652;--uy:0.758;--i:3" fill="#1F5B6B"><g class="eg-fig__move"><path class="eg-fig__arms" d="M-227.7 80.3A133.5 121.5 325.5 0 1 -38 229L-96 211A68.7 64.6 325.5 0 0 -196.5 129Z"/><circle class="eg-fig__head" cx="-148.2" cy="172.3" r="43.3"/></g></g><g class="eg-fig eg-fig--navy" style="--ux:-0.943;--uy:-0.332;--i:4" fill="#1D184B"><g class="eg-fig__move"><path class="eg-fig__arms" d="M-166.4 -183.4A137 120.6 384.7 0 1 -240.9 40.4L-254.4 -14.6A76.5 70.7 384.7 0 0 -203.7 -146.5Z"/><circle class="eg-fig__head" cx="-231.2" cy="-81.4" r="43.3"/></g></g><circle class="eg-core" r="72.3" fill="#B88B5B"/></svg>