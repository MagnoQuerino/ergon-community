# Isolamento do ambiente do Ergon: sem os discos do Windows e sem rodar programas do Windows daqui de dentro.
# Os arquivos entram pela entrada padrão do wsl.exe, chamado só pelo aplicativo Ergon.
[automount]
enabled = false
mountFsTab = false

[interop]
enabled = false
appendWindowsPath = false

[user]
default = root

[network]
hostname = ergon
generateResolvConf = true
