# Podman no ambiente do Ergon (WSL2, sem systemd): cgroups e eventos sem systemd; registros dos contêineres em
# arquivo, com limite de tamanho.
[containers]
log_driver = "k8s-file"
log_size_max = 10485760

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

[network]
# as redes dos serviços sempre nesta faixa: o ambiente libera só ela no repasse (ver ergon-ambiente)
default_subnet_pools = [{ "base" = "10.89.0.0/16", "size" = 24 }]
