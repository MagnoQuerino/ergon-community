<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ergon usando este computador</title>
  <link rel="stylesheet" href="computador.css">
</head>
<body class="selo-corpo">
  <div class="selo" id="selo" role="status" aria-live="polite">
    <span class="selo__luz" aria-hidden="true"></span>
    <span class="selo__texto"><strong id="quem">Ergon</strong> <span id="frase">usando este computador</span></span>
    <button type="button" class="selo__botao" id="botao">Assumir o controle</button>
    <kbd class="selo__tecla" id="tecla" title="Tecla de pânico">Ctrl+Alt+Esc</kbd>
  </div>
  <script src="computador-selo.js"></script>
</body>
</html>
