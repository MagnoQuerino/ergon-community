[package]
name = "ergon-desktop"
version = "1.1.0-rc.20"
description = "Ergon Desktop: o mesmo Ergon, numa janela própria"
authors = ["Os autores do Ergon"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# Versões fixadas (o Cargo.lock vai junto): a CI e a compilação local usam exatamente as mesmas.
[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
log = "=0.4.34"
# manifesto de versão: assinatura Ed25519, SHA-256 dos componentes e download HTTPS (rustls, sem OpenSSL)
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[features]
# só nos testes da instalação: aceita http://127.0.0.1 como origem e um chaveiro/manifesto de teste. Nunca no
# aplicativo publicado (a esteira compila sem este recurso).
origens-de-teste = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
