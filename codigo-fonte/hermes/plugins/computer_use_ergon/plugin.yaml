name: ergon
description: >-
  Ergon Desktop: controla a área de trabalho do computador da pessoa (captura de tela, mouse, teclado, programas) pelo
  aplicativo dela, com a decisão, os cartões e o registro no Ergon. O motor não tem tela: cada ação vai ao Ergon pela ponte.
