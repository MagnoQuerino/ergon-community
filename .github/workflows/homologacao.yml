# Homologação dos pacotes PUBLICADOS, em máquinas limpas e sem login no registro de imagens: baixa a versão da página de
# versões como uma pessoa baixaria e instala. Roda depois de cada lançamento e quando pedido.
name: Homologação
on:
  workflow_run:
    workflows: [Lançamento]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pré-versão para o teste do assistente no Windows (ex.: v1.1.0-rc.1); vazio = só a versão estável'
        required: false
        default: ''

permissions:
  contents: read

defaults:
  run:
    working-directory: codigo-fonte

jobs:
  pacote-linux:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Podman da conta, com o podman-compose que vai no pacote .deb
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq podman netavark aardvark-dns uidmap slirp4netns python3-yaml python3-dotenv
          sudo install -D -m 0644 desktop/src-tauri/recursos/podman-compose /usr/lib/ergon/podman-compose
      - name: Sem login no registro (as imagens precisam ser públicas)
        run: podman logout ghcr.io || true; docker logout ghcr.io || true
      - name: Pacote publicado, instalado com o lançador (Podman; uma versão antiga do lançador usa o Docker)
        run: REPO=${{ github.repository }} bash scripts/homologar-pacote.sh

  desktop-linux:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagem: ubuntu:24.04
            modo: deb
          - imagem: debian:12
            modo: deb
          - imagem: ubuntu:24.04
            modo: appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pacote do desktop da versão publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pkg out
          gh release download --repo ${{ github.repository }} --dir pkg --pattern '*.${{ matrix.modo == 'deb' && 'deb' || 'AppImage' }}'
          ls -l pkg
      - name: Instalação num ${{ matrix.imagem }} limpo (${{ matrix.modo }})
        run: docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/out:/out" -v "$PWD/desktop/linux:/t:ro" ${{ matrix.imagem }} bash /t/testar-limpo.sh ${{ matrix.modo }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homologacao-${{ matrix.modo }}-${{ strategy.job-index }}
          path: codigo-fonte/out

  desktop-windows:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Instalador da versão publicada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p pkg
          gh release download --repo ${{ github.repository }} --dir pkg --pattern '*-setup.exe'
          ls -l pkg
      - name: Instalar como uma pessoa (páginas do instalador), abrir e fechar
        shell: pwsh
        run: |
          $exe = (Get-ChildItem pkg -Filter *-setup.exe | Select-Object -First 1).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File desktop\testes\instalador-windows.ps1 -Instalador $exe -Saida out\instalar
      - name: Desinstalar
        if: always()
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop\testes\instalador-windows.ps1 -Desinstalar -Saida out\desinstalar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homologacao-windows
          path: codigo-fonte/out

  # Pré-versão (vX.Y.Z-rc.N): o instalador .exe PUBLICADO, numa máquina Windows sem Docker Desktop, instala o
  # Ergon inteiro sozinho pelo canal de teste (WSL próprio, manifesto assinado, imagens por digest), como a pessoa faria
  # com dois cliques. O assistente roda pelo mesmo caminho da janela, sem a janela (--instalar-sem-janela).
  assistente-windows:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
      (github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_branch, '-'))
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalador da pré-versão publicada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p pkg out
          gh release download "$TAG" --repo ${{ github.repository }} --dir pkg --pattern '*-setup.exe'
          ls -l pkg
      - name: Instalar o aplicativo e, por ele, o Ergon (sem Docker Desktop)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem pkg -Filter *-setup.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList '/S' -PassThru -Wait; Write-Host "instalador do aplicativo: saída $($p.ExitCode)"
          $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Ergon' } | Select-Object -First 1
          $pasta = if ($reg.InstallLocation) { $reg.InstallLocation.Trim('"') } else { Join-Path $env:LOCALAPPDATA 'Ergon' }
          $app = Get-ChildItem $pasta -Filter 'ergon-desktop.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { Get-ChildItem $pasta -ErrorAction SilentlyContinue; throw "aplicativo não encontrado em $pasta" }
          $t0 = Get-Date
          # espera só o aplicativo (WaitForExit): "-Wait" esperaria também o processo do WSL que mantém o ambiente ligado
          $p = Start-Process $app.FullName -ArgumentList '--instalar-sem-janela' -PassThru -RedirectStandardOutput out\assistente.log -RedirectStandardError out\assistente.err
          if (-not $p.WaitForExit(60 * 60 * 1000)) { Get-Content out\assistente.log -Tail 40; Stop-Process -Id $p.Id -Force; throw 'o assistente passou de 60 minutos' }
          $min = [math]::Round(((Get-Date) - $t0).TotalMinutes, 1)
          Get-Content out\assistente.log -Tail 80
          if ($p.ExitCode -ne 0) { Get-Content out\assistente.err -Tail 40; throw "o assistente saiu com $($p.ExitCode) depois de $min min" }
          $v = $env:TAG.TrimStart('v')
          $h = Invoke-RestMethod http://localhost:8787/api/health -TimeoutSec 20
          if ($h.version -ne $v) { throw "Ergon $($h.version) no ar; esperado $v" }
          Write-Host "ok    Ergon $($h.version) em http://localhost:8787, instalado pelo .exe publicado em $min min, sem Docker Desktop"
          $d = (wsl.exe -l -q | Out-String) -replace "`0", ''
          if ($d -notmatch '(?m)^Ergon\s*$') { throw "ambiente Ergon não registrado no WSL: $d" }
          Write-Host 'ok    ambiente WSL próprio "Ergon" registrado'
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'ErgonAmbiente'))) { throw 'pasta do ambiente fora do lugar' }
          Write-Host 'ok    ambiente em %LOCALAPPDATA%\ErgonAmbiente, separado da pasta do aplicativo'
      - name: Conta nova e a IA dela disponível (o motor da pessoa liga sozinho)
        shell: pwsh
        run: |
          $B = 'http://localhost:8787'
          $ws = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $corpo = @{ username = 'homologa'; password = 'cidade azul de vidro claro'; displayName = 'Homologação' } | ConvertTo-Json
          $r = Invoke-WebRequest "$B/api/auth/setup" -Method Post -Body $corpo -ContentType 'application/json' -Headers @{ Origin = $B } -WebSession $ws -SkipHttpErrorCheck
          if ($r.StatusCode -ne 200) { throw "criar a conta: $($r.StatusCode) $($r.Content)" }
          Write-Host 'ok    conta criada'
          $t0 = Get-Date; $estados = [System.Collections.Generic.List[string]]::new(); $ok = $false
          while (((Get-Date) - $t0).TotalMinutes -lt 10) {
            $st = Invoke-RestMethod "$B/api/ai/status" -WebSession $ws -TimeoutSec 30 -ErrorAction SilentlyContinue
            $e = if ($st) { "$($st.motor.state)$(if ($st.motor.error) { ": $($st.motor.error)" })$(if ($st.available) { ' (disponível)' })" } else { 'sem resposta' }
            if ($estados.Count -eq 0 -or $estados[-1] -ne $e) { $estados.Add($e); Write-Host ("  {0,5:N0} s  {1}" -f ((Get-Date) - $t0).TotalSeconds, $e) }
            if ($st.available) { $ok = $true; break }
            Start-Sleep 3
          }
          $seg = [int]((Get-Date) - $t0).TotalSeconds
          if (-not $ok) { throw "a IA da conta nova não ficou disponível em 10 min: $($estados -join ' → ')" }
          Write-Host "ok    IA da conta nova disponível em $seg s (botões de conectar liberados)"
          if (@($st.byok).Count -ne 3) { throw "chave própria: esperava 3 provedores, veio $(@($st.byok).Count)" }
          Write-Host 'ok    chave própria (OpenRouter, Anthropic, Gemini) oferecida pelo motor'
          $bk = Invoke-RestMethod "$B/api/me" -WebSession $ws
          $r = Invoke-WebRequest "$B/api/ai/byok/openrouter" -Method Put -Body (@{ key = 'sk-or-v1-' + ('0' * 64) } | ConvertTo-Json) -ContentType 'application/json' -Headers @{ Origin = $B; 'x-csrf-token' = $bk.csrf } -WebSession $ws -SkipHttpErrorCheck
          if ($r.StatusCode -ne 400) { throw "chave inventada deveria ser recusada pelo provedor; veio $($r.StatusCode) $($r.Content)" }
          Write-Host "ok    chave inventada recusada pelo provedor (nada gravado): $((($r.Content | ConvertFrom-Json).message))"
      - name: Desinstalar com "apagar também a conta e os dados" (o ambiente sai junto)
        shell: pwsh
        run: |
          $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'Ergon' } | Select-Object -First 1
          $pasta = if ($reg.InstallLocation) { $reg.InstallLocation.Trim('"') } else { Join-Path $env:LOCALAPPDATA 'Ergon' }
          # _?= roda o desinstalador no lugar (sem se copiar para a pasta temporária), para esperar o fim de verdade
          $p = Start-Process (Join-Path $pasta 'uninstall.exe') -ArgumentList '/S', '/APAGARDADOS', "_?=$pasta" -PassThru
          if (-not $p.WaitForExit(10 * 60 * 1000)) { throw 'o desinstalador passou de 10 minutos' }
          Write-Host "desinstalador: saída $($p.ExitCode)"
          $d = (wsl.exe -l -q 2>$null | Out-String) -replace "`0", ''
          if ($d -match '(?m)^Ergon\s*$') { throw "o ambiente Ergon ficou registrado no WSL: $d" }
          Write-Host 'ok    ambiente WSL "Ergon" removido'
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'ErgonAmbiente')) { throw 'a pasta ErgonAmbiente ficou' }
          Write-Host 'ok    pasta %LOCALAPPDATA%\ErgonAmbiente removida'
          if (Test-Path (Join-Path $pasta 'ergon-desktop.exe')) { throw 'o aplicativo ficou instalado' }
          Write-Host 'ok    aplicativo removido'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homologacao-assistente-windows
          path: codigo-fonte/out
      - name: Limpar
        if: always()
        shell: pwsh
        run: |
          wsl.exe --unregister Ergon 2>&1 | Out-Null
          exit 0
