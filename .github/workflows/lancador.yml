# Lançador antes do lançamento: monta o pacote local com o lançador DESTE commit e as imagens já publicadas, e faz o
# ciclo completo numa máquina limpa (instalar, apagar o zip, usar "ergon" de outra pasta, remover guardando os dados,
# instalar de novo, remover --tudo), no Linux, com o Podman da conta. No Windows, o lançador antigo só mostra o aviso do
# Ergon Desktop.
name: Lançador
on:
  push:
    branches: [main, 'distribuicao/**']
    paths: ['codigo-fonte/ergon.sh', 'codigo-fonte/ergon.ps1', 'codigo-fonte/ergon.cmd', 'codigo-fonte/scripts/teste-comandos.ps1', 'codigo-fonte/instalador/**', 'codigo-fonte/deploy/local/**', 'codigo-fonte/scripts/homologar-pacote.sh', 'Instalar Ergon no *', '.github/workflows/lancador.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: codigo-fonte

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pacote com o lançador deste commit e as imagens publicadas
        run: |
          V=$(curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" | jq -r .version)
          DONO=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')
          mkdir -p pacote
          sed -e "s/__VERSAO__/$V/g" -e "s/__DONO__/$DONO/g" -e "s#__REPO__#${{ github.repository }}#g" deploy/local/docker-compose.yml > pacote/docker-compose.yml
          cp ergon.ps1 ergon.cmd ergon.sh pacote/ && chmod +x pacote/ergon.sh
          cp ../docs/INSTALAR.md pacote/LEIA-ME.md
          echo "$V" > pacote/VERSAO
      - name: Podman da conta, com o podman-compose que vai no pacote .deb (sem Docker)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq podman netavark aardvark-dns uidmap slirp4netns python3-yaml python3-dotenv
          sudo install -D -m 0644 desktop/src-tauri/recursos/podman-compose /usr/lib/ergon/podman-compose
      - name: Sem login no registro
        run: podman logout ghcr.io || true
      - name: Ciclo completo com o Podman de verdade
        # o lançador deste commit com as imagens da versão estável publicada; a subida entre versões (com a renovação da
        # equipe) é conferida na Homologação, depois do lançamento, com as imagens da versão nova
        run: REPO=${{ github.repository }} PACOTE_DIR=pacote PACOTE_ANTIGO=nenhum bash scripts/homologar-pacote.sh

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: O lançador antigo do Windows (Docker Desktop, até a rc.11) só mostra o aviso do Ergon Desktop
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\teste-comandos.ps1
