# Lançamento: uma etiqueta vX.Y.Z (igual à versão do package.json) publica a MESMA versão para todos —
# as imagens que a nuvem implanta e o pacote que o Ergon local baixa com "ergon atualizar".
#   git tag v1.0.0 && git push origin v1.0.0
name: Lançamento
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # criar a versão e anexar o pacote
  packages: write   # publicar as imagens no registro do GitHub

jobs:
  lancamento:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Etiqueta igual à versão do package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "etiqueta $GITHUB_REF_NAME diferente do package.json ($V)"; exit 1; }
          echo "VERSAO=$V" >> "$GITHUB_ENV"
          echo "DONO=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Testes (Linux, no contêiner)
        run: docker build --target test .

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem do Ergon (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: ERGON_BUILD=${{ env.BUILD }}
          push: true
          tags: |
            ghcr.io/${{ env.DONO }}/ergon-community:${{ env.VERSAO }}
            ghcr.io/${{ env.DONO }}/ergon-community:latest

      - name: Imagem do motor (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./hermes
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.DONO }}/ergon-community-hermes:${{ env.VERSAO }}
            ghcr.io/${{ env.DONO }}/ergon-community-hermes:latest

      - name: Pacote local + manifesto da versão
        run: |
          mkdir -p pacote
          sed -e "s/__VERSAO__/$VERSAO/g" -e "s/__DONO__/$DONO/g" -e "s#__REPO__#${{ github.repository }}#g" \
            deploy/local/docker-compose.yml > pacote/docker-compose.yml
          cp ergon.ps1 ergon.cmd ergon.sh pacote/ && chmod +x pacote/ergon.sh
          cp docs/INSTALAR.md pacote/LEIA-ME.md
          echo "$VERSAO" > pacote/VERSAO
          (cd pacote && zip -qr "../ergon-local-$VERSAO.zip" .)
          # novidades desta versão: a seção dela no CHANGELOG.md
          awk -v v="## $VERSAO" '$0 ~ "^## " { on = index($0, v) == 1 } on' CHANGELOG.md > novidades.md
          node -e '
            const fs = require("fs");
            const v = process.env.VERSAO, repo = process.env.GITHUB_REPOSITORY, tag = process.env.GITHUB_REF_NAME;
            const zip = `ergon-local-${v}.zip`;
            const sha = require("crypto").createHash("sha256").update(fs.readFileSync(zip)).digest("hex");
            fs.writeFileSync("latest.json", JSON.stringify({
              version: v, notes: fs.readFileSync("novidades.md", "utf8").slice(0, 2000),
              url: `https://github.com/${repo}/releases/tag/${tag}`,
              bundle: `https://github.com/${repo}/releases/download/${tag}/${zip}`,
              sha256: sha, published_at: new Date().toISOString(),
            }));'

      - name: Publicar a versão
        uses: softprops/action-gh-release@v2
        with:
          body_path: novidades.md
          files: |
            ergon-local-${{ env.VERSAO }}.zip
            latest.json

  # Ergon Desktop: os instaladores entram na MESMA versão (mesma etiqueta), depois das imagens e do pacote local.
  # Sem chave de assinatura configurada, o atualizador automático do aplicativo fica desligado (docs/DESKTOP.md).
  desktop:
    needs: lancamento
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            plataforma: windows
            pacotes: nsis
          - os: ubuntu-22.04
            plataforma: linux
            pacotes: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Dependências do WebKitGTK (Linux)
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file
      - name: Rust 1.98.0
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Testes e pacotes
        shell: bash
        working-directory: desktop
        run: |
          (cd src-tauri && cargo test --locked --release)
          npm ci --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.pacotes }}
      - name: Somas e ficha da versão
        shell: bash
        run: |
          shopt -s nullglob
          node desktop/scripts/ficha.mjs ${{ matrix.plataforma }} desktop/src-tauri/target/release/bundle/{nsis,deb,appimage}/*.{exe,deb,AppImage}
      - name: Anexar à versão
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/pacotes/*
