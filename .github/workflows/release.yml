# Lançamento: uma etiqueta vX.Y.Z (igual à versão do package.json) publica a MESMA versão para todos —
# as imagens que a nuvem implanta e o pacote que o Ergon local baixa com "ergon atualizar".
#   git tag v1.0.0 && git push origin v1.0.0
name: Lançamento
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # criar a versão e anexar o pacote
  packages: write   # publicar as imagens no registro do GitHub

defaults:
  run:
    working-directory: codigo-fonte

jobs:
  lancamento:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Etiqueta igual à versão do package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "etiqueta $GITHUB_REF_NAME diferente do package.json ($V)"; exit 1; }
          echo "VERSAO=$V" >> "$GITHUB_ENV"
          echo "DONO=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"
          echo "BUILD=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # build repetível: datas dos arquivos presas à do commit (camada reaproveitada do cache fica idêntica)
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Testes (Linux, no contêiner)
        run: docker build --target test .

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem do Ergon (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: codigo-fonte
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: ERGON_BUILD=${{ env.BUILD }}
          # cache entre versões: camada que não mudou sai com o MESMO digest e quem atualiza não baixa de novo
          cache-from: type=gha,scope=ergon
          cache-to: type=gha,scope=ergon,mode=max
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: |
            ghcr.io/${{ env.DONO }}/ergon-community:${{ env.VERSAO }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}/ergon-community:latest', env.DONO) || '' }}

      - name: Imagem do motor (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: codigo-fonte/hermes
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=ergon-hermes
          cache-to: type=gha,scope=ergon-hermes,mode=max
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: |
            ghcr.io/${{ env.DONO }}/ergon-community-hermes:${{ env.VERSAO }}
            ${{ !contains(github.ref_name, '-') && format('ghcr.io/{0}/ergon-community-hermes:latest', env.DONO) || '' }}

      - name: Pacote local + manifesto da versão
        run: |
          mkdir -p pacote
          sed -e "s/__VERSAO__/$VERSAO/g" -e "s/__DONO__/$DONO/g" -e "s#__REPO__#${{ github.repository }}#g" \
            deploy/local/docker-compose.yml > pacote/docker-compose.yml
          cp ergon.ps1 ergon.cmd ergon.sh pacote/ && chmod +x pacote/ergon.sh
          cp ../docs/INSTALAR.md pacote/LEIA-ME.md
          echo "$VERSAO" > pacote/VERSAO
          (cd pacote && zip -qr "../ergon-local-$VERSAO.zip" .)
          # novidades desta versão: a seção dela no CHANGELOG.md
          awk -v v="## $VERSAO" '$0 ~ "^## " { on = index($0, v) == 1 } on' ../docs/CHANGELOG.md > novidades.md
          node -e '
            const fs = require("fs");
            const v = process.env.VERSAO, repo = process.env.GITHUB_REPOSITORY, tag = process.env.GITHUB_REF_NAME;
            const zip = `ergon-local-${v}.zip`;
            const sha = require("crypto").createHash("sha256").update(fs.readFileSync(zip)).digest("hex");
            fs.writeFileSync("latest.json", JSON.stringify({
              version: v, notes: fs.readFileSync("novidades.md", "utf8").slice(0, 2000),
              url: `https://github.com/${repo}/releases/tag/${tag}`,
              bundle: `https://github.com/${repo}/releases/download/${tag}/${zip}`,
              sha256: sha, published_at: new Date().toISOString(),
            }));'

      - name: Publicar a versão
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}   # vX.Y.Z-rc.N = canal de teste
          body_path: codigo-fonte/novidades.md
          files: |
            codigo-fonte/ergon-local-${{ env.VERSAO }}.zip
            codigo-fonte/latest.json

  # Ergon Desktop: os instaladores entram na MESMA versão (mesma etiqueta), depois das imagens e do pacote local.
  # Sem chave de assinatura configurada, o atualizador automático do aplicativo fica desligado (docs/DESKTOP.md).
  desktop:
    needs: lancamento
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            plataforma: windows
            pacotes: nsis
          - os: ubuntu-22.04
            plataforma: linux
            pacotes: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
      - name: Dependências do WebKitGTK (Linux)
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev file
      - name: Rust 1.98.0
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Testes e pacotes
        shell: bash
        working-directory: codigo-fonte/desktop
        env:
          # pré-versão (vX.Y.Z-rc.N): o aplicativo segue o canal de teste (manifesto na pré-versão fixa canal-teste)
          ERGON_CANAL: ${{ contains(github.ref_name, '-') && 'teste' || 'estavel' }}
        run: |
          (cd src-tauri && cargo test --locked --release)
          npm ci --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.pacotes }}
      - name: Somas e ficha da versão
        shell: bash
        run: |
          shopt -s nullglob
          node desktop/scripts/ficha.mjs ${{ matrix.plataforma }} desktop/src-tauri/target/release/bundle/{nsis,deb,appimage}/*.{exe,deb,AppImage}
      - name: Anexar à versão
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            codigo-fonte/desktop/src-tauri/target/release/bundle/nsis/*.exe
            codigo-fonte/desktop/src-tauri/target/release/bundle/deb/*.deb
            codigo-fonte/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            codigo-fonte/desktop/pacotes/*

  # Ambiente do Ergon no Windows sem Docker Desktop: a distribuição WSL própria (Alpine + Docker Engine) que o Ergon
  # Desktop importa. Componente do manifesto, baixado uma vez, com a mesma versão da etiqueta.
  ambiente:
    needs: lancamento
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ambiente WSL (rootfs) desta versão
        run: |
          V=$(node -p "require('./package.json').version")
          docker build -q --build-arg VERSAO="$V" -t ergon-ambiente desktop/ambiente
          id=$(docker create ergon-ambiente)
          docker export "$id" | gzip -n -9 > ergon-ambiente-wsl.tar.gz
          docker rm "$id" >/dev/null
          echo "ambiente: $(du -m ergon-ambiente-wsl.tar.gz | cut -f1) MB comprimido"; sha256sum ergon-ambiente-wsl.tar.gz
      - name: Anexar à versão
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            codigo-fonte/ergon-ambiente-wsl.tar.gz

  # Manifesto do canal: só depois de TODAS as partes publicadas. Um cliente limpo (sem login) resolve e confere cada
  # artefato; só então o manifesto assinado é anexado. Sem a chave (segredo ERGON_MANIFESTO_CHAVE), nada é promovido
  # e a versão segue como antes (latest.json). Estável: releases/latest/download/manifesto-estavel.json; teste: a
  # pré-versão fixa "canal-teste".
  manifesto:
    needs: [lancamento, desktop, ambiente]
    runs-on: ubuntu-24.04
    env:
      ERGON_MANIFESTO_CHAVE: ${{ secrets.ERGON_MANIFESTO_CHAVE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - name: Gerar, assinar e conferir como cliente limpo
        if: env.ERGON_MANIFESTO_CHAVE != ''
        run: |
          CANAL=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo teste || echo estavel)
          echo "CANAL=$CANAL" >> "$GITHUB_ENV"
          node scripts/distribuicao/cli.mjs gerar --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --canal "$CANAL" --saida "manifesto-$CANAL.json"
          node scripts/distribuicao/cli.mjs assinar --chave ambiente "manifesto-$CANAL.json"
          node scripts/distribuicao/cli.mjs resolver "manifesto-$CANAL.json" --canal "$CANAL" --edicao "$(jq -r .edicao "manifesto-$CANAL.json")"
      - name: Promover no canal estável (anexa à versão)
        if: env.ERGON_MANIFESTO_CHAVE != '' && env.CANAL == 'estavel'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codigo-fonte/manifesto-estavel.json
            codigo-fonte/manifesto-estavel.json.sig
      - name: Promover no canal de teste (pré-versão fixa canal-teste)
        if: env.ERGON_MANIFESTO_CHAVE != '' && env.CANAL == 'teste'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view canal-teste >/dev/null 2>&1 || gh release create canal-teste --prerelease --title "Canal de teste" --notes "Ponteiro do canal de teste: manifesto assinado da pré-versão mais recente."
          gh release upload canal-teste manifesto-teste.json manifesto-teste.json.sig --clobber
      - name: Sem chave, sem manifesto
        if: env.ERGON_MANIFESTO_CHAVE == ''
        run: echo "::warning::ERGON_MANIFESTO_CHAVE não configurado; manifesto do canal não promovido (a versão segue só com latest.json)"

  # Os instaladores também na raiz do repositório, como em qualquer programa: quem baixa o zip do repositório já os
  # encontra. Um commit no main depois que a versão está publicada (sem disparar outros workflows).
  instaladores-na-raiz:
    needs: desktop
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copiar da versão publicada para a raiz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/v"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/v" --pattern '*-setup.exe' --pattern '*.deb'
          # Windows: o instalador do desktop é o caminho principal (sem Docker) e segue a versão mais recente, de teste
          # inclusive; o .deb da raiz só muda nas estáveis
          cp "$RUNNER_TEMP"/v/*-setup.exe "Ergon Desktop para Windows.exe"
          case "$GITHUB_REF_NAME" in *-*) ;; *) cp "$RUNNER_TEMP"/v/*.deb "Ergon Desktop para Linux.deb" ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Ergon Desktop para Windows.exe" "Ergon Desktop para Linux.deb"
          git diff --cached --quiet || { git commit -m "Instaladores da $GITHUB_REF_NAME na raiz"; git push origin HEAD:main; }
