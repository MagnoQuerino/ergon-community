# Ergon Desktop: compila e testa o aplicativo (Tauri 2) no Windows e no Linux a cada envio que mexe nele, e guarda os
# pacotes como artefatos da execução (instalador NSIS, .deb, AppImage, somas SHA-256 e a ficha da versão).
# Compilar não é homologar: os pacotes ainda precisam ser instalados e testados (docs/DESKTOP.md).
name: Ergon Desktop
on:
  push:
    branches: [main, 'desktop/**']
    paths: ['desktop/**', 'ergon.ps1', 'ergon.sh', 'package.json', 'scripts/brand-assets.mjs', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'ergon.ps1', 'ergon.sh', 'package.json', 'scripts/brand-assets.mjs', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSAO: '1.98.0'
  NODE_VERSAO: '24.18.1'

jobs:
  linux:
    # a base mais antiga homologada (Ubuntu 22.04): o que compila aqui roda no 22.04, no 24.04 e no Debian 12
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSAO }}
      - name: Dependências do WebKitGTK e do empacotamento
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev file
      - name: Rust ${{ env.RUST_VERSAO }}
        run: rustup toolchain install "$RUST_VERSAO" --profile minimal && rustup default "$RUST_VERSAO"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            desktop/src-tauri/target
          key: desktop-linux-${{ env.RUST_VERSAO }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Arquivos da marca em dia (ícone do aplicativo incluído)
        run: node scripts/brand-assets.mjs --check
      - name: Testes do aplicativo
        working-directory: desktop/src-tauri
        run: cargo test --locked --release
      - name: Lançador do Linux (sintaxe)
        run: bash -n ergon.sh
      - name: Pacotes .deb e AppImage
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles deb,appimage
      - name: Somas e ficha da versão
        run: node desktop/scripts/ficha.mjs linux desktop/src-tauri/target/release/bundle/deb/*.deb desktop/src-tauri/target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ergon-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/pacotes/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSAO }}
      - name: Rust ${{ env.RUST_VERSAO }}
        run: rustup toolchain install $env:RUST_VERSAO --profile minimal; rustup default $env:RUST_VERSAO
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            desktop/src-tauri/target
          key: desktop-windows-${{ env.RUST_VERSAO }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Testes do aplicativo
        working-directory: desktop/src-tauri
        run: cargo test --locked --release
      - name: Lançador do Windows (sintaxe)
        shell: pwsh
        run: |
          $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ergon.ps1), [ref]$null, [ref]$e)
          if ($e.Count) { $e | ForEach-Object { $_.Message }; exit 1 }
      - name: Instalador NSIS
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles nsis
      - name: Somas e ficha da versão
        shell: bash
        run: node desktop/scripts/ficha.mjs windows desktop/src-tauri/target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ergon-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/pacotes/*
          if-no-files-found: error
