name: Ponte ou integração
description: Ligar o Ergon a um jogo, robô, carro, assistente de voz ou outra plataforma.
labels: [ponte]
body:
  - type: input
    id: plataforma
    attributes: { label: Plataforma, placeholder: "ex.: jogo de blocos, robô com ESP32, assistente de voz" }
    validations: { required: true }
  - type: textarea
    id: ideia
    attributes: { label: O que a ponte faz, description: "O que os agentes fazem lá, como a pessoa conversa e aprova." }
    validations: { required: true }
  - type: textarea
    id: precisa
    attributes: { label: O que você precisa da API do Ergon, description: "Estado, eventos, ações, permissões, voz…" }
  - type: input
    id: repo
    attributes: { label: Repositório do protótipo (se houver) }
